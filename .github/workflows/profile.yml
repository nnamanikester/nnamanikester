name: Refresh profile

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: [scripts/**, .github/workflows/profile.yml]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build hero and stats artwork
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile stats"
            git push
          fi

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#DB2777&color_dots=#EEEBF5,#DDD3FB,#B9A2F8,#8B5CF6,#5B21B6
            dist/snake-dark.svg?palette=github-dark&color_snake=#F472B6&color_dots=#1C1A28,#2E2452,#4C2F9A,#7C4DEB,#B794F6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
